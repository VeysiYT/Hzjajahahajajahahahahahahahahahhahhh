name: Build Minecraft Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Unzip Template
      run: |
        unzip -o breakable-bedrock-template-1.20.1.zip

    - name: Fix Mixin Filename
      run: |
        mv src/main/java/com/forsekany/breakable_bedrock/mixin/ExampleMixin.java src/main/java/com/forsekany/breakable_bedrock/mixin/AbstractBlockMixin.java || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload Mod Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Mod
        path: build/libs/*.jar
